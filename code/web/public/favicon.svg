<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Doppelmap">
  <!-- Two faces that resemble each other, joined by an edge: the whole app in
       one mark. Reads at 16px because it is only three shapes. -->
  <rect width="64" height="64" rx="14" fill="#2a78d6"/>
  <line x1="22" y1="34" x2="42" y2="30" stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.55" stroke-linecap="round"/>
  <circle cx="22" cy="34" r="10" fill="#ffffff"/>
  <circle cx="42" cy="30" r="7" fill="#ffffff" fill-opacity="0.8"/>
</svg>
