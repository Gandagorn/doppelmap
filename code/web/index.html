<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doppelmap</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <input id="search" type="text" placeholder="Search a name..." autocomplete="off" />
      <div id="search-results"></div>
      <div id="popularity-control">
        <label for="popularity-slider">Popularity: <span id="popularity-label">Show all</span></label>
        <input id="popularity-slider" type="range" min="0" max="100" value="0" step="1" />
      </div>
      <div id="graph-container"></div>
      <aside id="sidebar" hidden></aside>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
